apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: id-039
data:
  default.conf: |
    server {
      listen 8080 default_server;
      server_name _;
      return 404;
    }
    server {
      listen 8080;
      server_name www.iam-039.com;
      proxy_set_header Host $host;
      location = /research { proxy_pass http://app-research-svc; }
      location /research/ { proxy_pass http://app-research-svc; }
      location = /api-039 { proxy_pass http://api-039-svc; }
      location /api-039/ { proxy_pass http://api-039-svc; }
      location / { proxy_pass http://portal-039-svc; }
    }
    server {
      listen 8080;
      server_name admin.iam-039.com;
      client_max_body_size 128k;
      proxy_set_header Host $host;
      location / { proxy_pass http://admin-039-svc; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-039
  namespace: id-039
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-039
  template:
    metadata:
      labels:
        app: gateway-039
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.30-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        volumeMounts:
        - name: routes
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: routes
        configMap:
          name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-039-svc
  namespace: id-039
spec:
  type: NodePort
  selector:
    app: gateway-039
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
