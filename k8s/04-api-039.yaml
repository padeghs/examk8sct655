apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-039
  namespace: id-039
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: api-039
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-039
        image: localhost/id039-web:4.0
        imagePullPolicy: Never
        command:
        - gunicorn
        args:
        - --no-control-socket
        - --bind
        - 0.0.0.0:5000
        - --threads
        - '4'
        - echo:app
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
            httpHeaders:
            - name: Host
              value: localhost
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
            httpHeaders:
            - name: Host
              value: localhost
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api-039-svc
  namespace: id-039
spec:
  type: ClusterIP
  selector:
    app: api-039
  ports:
  - port: 80
    targetPort: 5000
