{% extends "base.html" %}
{% block title %}แก้ไขเนื้อหาสรุปงานวิจัย{% endblock %}
{% block content %}
<main class="paper">
  <nav aria-label="เมนูหลัก"><a href="/">กลับหน้า Admin</a><a href="{{ public_url }}">กลับไปหน้าสรุปงานวิจัย</a></nav>
  <h1>แก้ไขเนื้อหาสรุปงานวิจัย</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="revision" value="{{ revision }}">
    <label for="article">เนื้อหางานวิจัย</label>
    <p class="hint" id="limit">{{ minimum }} ถึง {{ limit }} คำ</p>
    <textarea id="article" name="article" rows="14" required aria-describedby="limit">
{{ article }}</textarea>
    <button type="submit">บันทึกการแก้ไข</button>
  </form>
</main>
{% endblock %}
